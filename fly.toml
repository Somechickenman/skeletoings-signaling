# Fly.io config. Run "fly launch --no-deploy" in this folder, pick a unique app name, then "fly deploy".
app = "skeletoings-signal"
primary_region = "ams"

[build]

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
